<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài 27 · Đường tròn · Toán 5</title>
<style>
:root{
  --chu:#1b2559; --vien:#1b2559; --dung:#11772f; --sai:#b24a00;
  --kd:#f26b0f; --kd2:#fff1e2; --kp:#1576d1; --kp2:#e3f1ff; --hd:#1f8f45; --hd2:#e2f7e8; --vd:#7b3fc4; --vd2:#efe5ff;
  --c1:var(--kd); --c2:var(--kd2);
  --co:clamp(19px,2.1vw,27px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--chu);font-size:var(--co);height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  background:
   radial-gradient(circle at 8% 12%, transparent 46px, #ffffff66 47px, #ffffff66 52px, transparent 53px),
   radial-gradient(circle at 92% 18%, transparent 70px, #ffffff55 71px, #ffffff55 78px, transparent 79px),
   radial-gradient(circle at 85% 88%, transparent 56px, #ffffff66 57px, #ffffff66 63px, transparent 64px),
   radial-gradient(circle at 12% 85%, transparent 34px, #ffffff66 35px, #ffffff66 40px, transparent 41px),
   radial-gradient(900px 600px at 0% 0%, #ffe6a8, transparent 60%),
   radial-gradient(900px 600px at 100% 0%, #b9e3ff, transparent 60%),
   radial-gradient(900px 700px at 50% 110%, #ffc8e1, transparent 60%),
   linear-gradient(160deg,#fff1c9,#ffe0ec 55%,#d3efff);}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input{font-family:inherit}
#phao{position:fixed;inset:0;pointer-events:none;z-index:999}
.sBay{position:fixed;z-index:998;pointer-events:none;font-size:30px}

/* thanh trên */
.tren{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:0 0 auto;z-index:3}
.nutNho{width:52px;height:52px;border:none;border-radius:16px;background:linear-gradient(180deg,#fff,#e4edff);font-size:24px;line-height:1;flex:0 0 auto;
  box-shadow:inset 0 2px 0 #fff,0 5px 0 #9fb2e6,0 9px 12px #1b255933}
.nutNho:active{transform:translateY(4px);box-shadow:0 1px 0 #9fb2e6}
.nutNho.tat{opacity:.45}
.tabs{display:flex;gap:8px;flex:1;min-width:0;justify-content:center}
.tab{border:none;border-radius:99px;padding:8px 16px;font-weight:800;font-size:17px;min-height:52px;white-space:nowrap;background:#ffffffc0;color:var(--chu);
  box-shadow:inset 0 0 0 3px var(--tc),0 4px 0 var(--tc);}
.tab.on{background:var(--tc);color:#fff;text-shadow:0 1px 0 #0005}
.tab[data-p="0"]{--tc:var(--kd)} .tab[data-p="1"]{--tc:var(--kp)} .tab[data-p="2"]{--tc:var(--hd)} .tab[data-p="3"]{--tc:var(--vd)}
.saoDem{font-weight:900;font-size:20px;background:linear-gradient(180deg,#fff3a6,#ffc61a);border-radius:99px;padding:8px 16px;box-shadow:inset 0 2px 0 #fff,0 4px 0 #b88a00;white-space:nowrap;color:#4d3800}
body.bia .tren .tabs,body.bia .chan{visibility:hidden}

/* khung */
.khung{flex:1 1 auto;overflow:auto;padding:6px 14px 14px;display:flex;justify-content:center;z-index:1}
.noi{width:min(1180px,100%);margin:auto 0}
.the{position:relative;background:linear-gradient(180deg,var(--c2) 0,#fff 150px,#fffdf8);border:5px solid var(--c1);border-radius:32px;padding:clamp(14px,2vw,26px);
  box-shadow:inset 0 3px 0 #fff,0 10px 0 var(--c1),0 26px 36px -10px #1b255955;display:flex;flex-direction:column;gap:14px}
.the.p0{--c1:var(--kd);--c2:var(--kd2)} .the.p1{--c1:var(--kp);--c2:var(--kp2)} .the.p2{--c1:var(--hd);--c2:var(--hd2)} .the.p3{--c1:var(--vd);--c2:var(--vd2)}
.dau{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nhan{background:var(--c1);color:#fff;font-weight:900;font-size:.72em;padding:6px 18px;border-radius:99px;box-shadow:inset 0 2px 0 #fff6,0 4px 0 #0004;text-shadow:0 1px 0 #0005}
.chamTien{display:flex;gap:6px;margin-left:auto}
.chamTien i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--c1)}
.chamTien i.x{background:var(--c1)} .chamTien i.n{background:#ffd23f;box-shadow:inset 0 0 0 3px var(--c1),0 0 0 3px #fff}
.cauHoi{font-size:calc(var(--co)*1.18);font-weight:900;line-height:1.35}
.huongDan{font-weight:700;font-size:.86em;line-height:1.45}
.ph{min-height:1.45em;font-weight:800;font-size:.9em;line-height:1.4}
.ph.tot{color:var(--dung)} .ph.chua{color:var(--sai)}
.goiY{background:linear-gradient(180deg,#fff8c8,#ffe68a);border-left:8px solid #c99a00;border-radius:14px;padding:8px 14px;font-weight:700;font-size:.82em;line-height:1.45}
.goiY[hidden]{display:none}

/* nút */
.nut{min-height:72px;padding:12px 28px;border:none;border-radius:24px;color:#fff;font-weight:900;text-shadow:0 2px 0 #0004;
  background:linear-gradient(180deg,#36d266,#14843d);box-shadow:inset 0 3px 0 #fff7,0 7px 0 #0b5a28,0 14px 16px #0b5a2855}
.nut:active{transform:translateY(5px);box-shadow:inset 0 3px 0 #fff6,0 2px 0 #0b5a28}
.nut.xanh{background:linear-gradient(180deg,#3fb2ff,#0d67b5);box-shadow:inset 0 3px 0 #fff7,0 7px 0 #074a85,0 14px 16px #074a8555}
.nut.cam{background:linear-gradient(180deg,#ffa43a,#e05a00);box-shadow:inset 0 3px 0 #fff7,0 7px 0 #8a3600,0 14px 16px #8a360055}
.nut.tim{background:linear-gradient(180deg,#b57bff,#6b2fc0);box-shadow:inset 0 3px 0 #fff7,0 7px 0 #45177f,0 14px 16px #45177f55}
.nut.vang{background:linear-gradient(180deg,#ffe25a,#f2b300);color:#3d2c00;text-shadow:none;box-shadow:inset 0 3px 0 #fff9,0 7px 0 #8f6a00,0 14px 16px #8f6a0055}
.nut.trang{background:linear-gradient(180deg,#fff,#e5edff);color:var(--chu);text-shadow:none;box-shadow:inset 0 3px 0 #fff,inset 0 0 0 3px #9fb2e6,0 7px 0 #8ea3dc,0 14px 16px #1b255933}
.nut:disabled{filter:grayscale(.7);opacity:.6;cursor:default}
.nut.nho{min-height:60px;padding:8px 18px;font-size:.84em}
.hangNut{display:flex;flex-wrap:wrap;gap:14px;align-items:center}

/* chân */
.chan{display:flex;gap:10px;align-items:center;padding:6px 12px 10px;flex:0 0 auto;flex-wrap:wrap;z-index:3}
.chan .nut{min-height:64px;padding:6px 20px;font-size:.84em}
.mas{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0}
.mas svg{flex:0 0 auto;filter:drop-shadow(0 5px 5px #0003)}
.mas.vui svg{animation:nhay .5s ease 2}
.bongNoi{background:linear-gradient(180deg,#fff,#fff6c4);border:3px solid #f2b300;border-radius:18px;padding:8px 14px;font-weight:800;font-size:.78em;position:relative;box-shadow:0 4px 0 #c99a00;line-height:1.35}
.bongNoi:before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#f2b300;border-left:0}

/* lời khen bật lên */
#khen{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);z-index:997;pointer-events:none;opacity:0;font-weight:900;font-size:clamp(28px,4.6vw,58px);
  text-align:center;padding:18px 34px;border-radius:30px;background:linear-gradient(180deg,#fffef0,#fff3b0);border:6px solid #ff9f1a;color:#c2410c;box-shadow:0 10px 0 #d97706,0 30px 50px #0004;max-width:90vw;line-height:1.25}
#khen.hien{animation:khenBat 1.7s ease forwards}
@keyframes khenBat{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-6deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(2deg)}25%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1b2559ee;color:#fff;padding:10px 20px;border-radius:99px;font-weight:800;z-index:99;font-size:18px;display:none}

/* bìa */
.bia1{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:center}
.tenBai{font-size:clamp(34px,4.6vw,62px);font-weight:900;line-height:1.1;background:linear-gradient(90deg,#e8590c,#d6336c,#7048e8,#1c7ed6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #fff)}
.phuDe{font-weight:800;font-size:.9em;color:#5b3d9e}
.luoi4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.oPhan{border:none;border-radius:24px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;font-weight:900;min-height:96px;
  background:linear-gradient(180deg,#fff,var(--t));box-shadow:inset 0 0 0 4px var(--c),inset 0 4px 0 #fff,0 7px 0 var(--c),0 14px 16px #1b255933}
.oPhan:hover{transform:translateY(-3px)}
.oPhan .ic{width:58px;height:58px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:30px;flex:0 0 auto;box-shadow:inset 0 3px 0 #fff7,0 4px 0 #0003}
.oPhan small{display:block;font-weight:700;font-size:.66em;opacity:.9;margin-top:2px}
.oPhan[data-p="0"]{--c:var(--kd);--t:var(--kd2)} .oPhan[data-p="1"]{--c:var(--kp);--t:var(--kp2)} .oPhan[data-p="2"]{--c:var(--hd);--t:var(--hd2)} .oPhan[data-p="3"]{--c:var(--vd);--t:var(--vd2)}
.anhBia{width:100%;border-radius:22px;border:5px solid #fff;box-shadow:0 8px 0 #f0b04d,0 20px 30px #0003}

/* lựa chọn */
.luoiChon{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lc{position:relative;min-height:80px;border:none;border-radius:22px;padding:10px 14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;line-height:1.3;
  background:linear-gradient(180deg,#fff,var(--t,#eef3ff));box-shadow:inset 0 0 0 4px var(--c,#5a6fc4),inset 0 4px 0 #fff,0 6px 0 var(--d,#3a4a99),0 12px 14px #1b255926}
.lc:hover:not(:disabled){transform:translateY(-3px)}
.lc .em{font-size:2.3em;line-height:1}
.lc .so{flex:0 0 44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:inset 0 3px 0 #fff6,0 3px 0 var(--d)}
.lc.chon{background:linear-gradient(180deg,#fffbe0,#ffe27a);box-shadow:inset 0 0 0 4px var(--c),0 0 0 5px #ffb300,0 6px 0 var(--d)}
.lc.laDung{background:linear-gradient(180deg,#eafbee,#b9eec3);color:#0b5a22;box-shadow:inset 0 0 0 5px #19a24a,0 6px 0 #0b6a2b}
.lc.laSai{background:linear-gradient(180deg,#fff1dd,#ffd29a);color:#8a3a00;box-shadow:inset 0 0 0 5px #ea7a0b,0 6px 0 #a35200}
.lc .dau2{position:absolute;right:8px;top:6px;font-size:.8em;font-weight:900}
.lc:disabled{cursor:default}
.m0{--c:#e8453c;--t:#ffe3e1;--d:#a3231c} .m1{--c:#f59f00;--t:#fff0c7;--d:#a86b00} .m2{--c:#1fa149;--t:#dcf7e3;--d:#0b6a2b}
.m3{--c:#1c8de0;--t:#d9efff;--d:#0a5c9c} .m4{--c:#8c55e6;--t:#ece1ff;--d:#5430b0} .m5{--c:#e64c9a;--t:#ffdcee;--d:#a3195f}
.dsTo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.dsTo .lc{min-height:110px;font-size:1.3em}

/* bàn phím số */
.phim{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:560px}
.phim .lc{min-height:68px;font-size:1.2em}
.oSo{display:inline-grid;place-items:center;min-width:96px;height:84px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 4px var(--c1),inset 0 6px 10px #0001;font-size:1.6em;font-weight:900;margin:0 6px;vertical-align:middle}
.oSo.dung{box-shadow:inset 0 0 0 5px #19a24a;background:#eafbee;color:#0b5a22}

/* sơ đồ / svg */
.hinhSvg{width:100%;max-width:820px;align-self:center;background:#fff;border-radius:22px;box-shadow:inset 0 0 0 4px #d6e3fb,0 6px 0 #c3d3f5;touch-action:none}
.hai{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
.diemCham{cursor:pointer}

/* bàn vẽ com pa */
.banVe{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:16px;align-items:start}
.giay{width:100%;max-height:52vh;background:#fff;border-radius:20px;box-shadow:inset 0 0 0 4px #c7d8f7,0 6px 0 #b4c8f0;touch-action:none;display:block;cursor:crosshair}
.bang{display:flex;flex-direction:column;gap:12px}
.dsViec{display:flex;flex-direction:column;gap:8px;max-height:30vh;overflow:auto;padding:4px}
.viec{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:16px;background:#f3f6ff;font-weight:700;font-size:.78em;line-height:1.35;box-shadow:inset 0 0 0 3px #d4ddf5}
.viec .sv{flex:0 0 34px;height:34px;border-radius:50%;background:#c4cff0;color:#fff;display:grid;place-items:center;font-weight:900}
.viec.dang{background:linear-gradient(180deg,#fffbe0,#ffeaa0);box-shadow:inset 0 0 0 4px #f2b300,0 4px 0 #c99a00}
.viec.dang .sv{background:#f08c00}
.viec.xong{background:#e7f8ec;box-shadow:inset 0 0 0 3px #7fcf98;color:#0b5a22}
.viec.xong .sv{background:#19a24a}
.buoc3{display:flex;gap:6px}
.buoc3 span{flex:1;text-align:center;padding:6px 4px;border-radius:12px;background:#eef2fb;font-weight:800;font-size:.66em;line-height:1.2;box-shadow:inset 0 0 0 2px #d4ddf5}
.buoc3 span.on{background:#1c8de0;color:#fff;box-shadow:0 3px 0 #0a5c9c}
.buoc3 span.ok{background:#19a24a;color:#fff}
.thuocBox{background:#fffaf0;border-radius:18px;padding:8px;box-shadow:inset 0 0 0 3px #f2c76b}
.thuocBox svg{width:100%;display:block;touch-action:none;cursor:pointer}
.doMo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:900}
.doMo b{font-size:1.15em;color:#c2410c;background:#fff;padding:4px 12px;border-radius:12px;box-shadow:inset 0 0 0 3px #ffb35c}
.nutCong{min-width:64px;min-height:56px;border:none;border-radius:16px;font-weight:900;background:linear-gradient(180deg,#fff,#ffe8c8);box-shadow:inset 0 0 0 3px #ff9f1a,0 4px 0 #c76b00}
.nutCong:active{transform:translateY(3px);box-shadow:inset 0 0 0 3px #ff9f1a}

/* video */
.manVideo{position:relative;background:#fff;border-radius:22px;box-shadow:inset 0 0 0 5px #1c8de0,0 7px 0 #0a5c9c;overflow:hidden}
.manVideo svg{display:block;width:100%;height:auto;max-height:52vh}
.phuDeVideo{position:absolute;left:3%;right:3%;bottom:3%;background:#1b2559e6;color:#fff;border-radius:16px;padding:8px 16px;font-weight:800;font-size:.86em;line-height:1.35;text-align:center}
.dkVideo{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dkVideo .nut{min-height:60px;padding:6px 16px;font-size:.8em}
.chamCanh{display:flex;gap:8px;flex:1;min-width:150px}
.chamCanh button{flex:1;height:18px;border:none;border-radius:99px;background:#d7e4fb;min-width:12px}
.chamCanh button.xong{background:#7cc0f5} .chamCanh button.on{background:#f08c00}
.vidRieng{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#eef6ff;border-radius:18px;padding:10px 14px;font-weight:700;font-size:.8em}
.vidRieng video{width:100%;max-height:46vh;border-radius:14px;background:#000}
.vidRieng label{cursor:pointer}
.vidRieng input{display:none}

/* ghi nhớ */
.ghiNho{background:linear-gradient(180deg,#e9f6ff,#cfeaff);border-radius:22px;padding:14px 20px;box-shadow:inset 0 0 0 4px #1c8de0,0 6px 0 #0a5c9c;font-weight:700;line-height:1.55}
.ghiNho li{margin-left:1.2em}

/* tô màu */
.bangMau{display:flex;flex-wrap:wrap;gap:10px}
.oMau{width:60px;height:60px;border-radius:50%;border:none;box-shadow:inset 0 0 0 4px #fff,0 0 0 3px #1b255944,0 4px 0 #0003}
.oMau.on{box-shadow:inset 0 0 0 4px #fff,0 0 0 6px #1b2559,0 4px 0 #0003;transform:scale(1.08)}
.oMau span{font-size:22px}

/* đúng sai 4 */
.dsHang{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 14px;border-radius:18px;background:linear-gradient(180deg,#fff,var(--t));box-shadow:inset 0 0 0 4px var(--c),0 5px 0 var(--d)}
.dsHang .nd{font-weight:700;line-height:1.4;font-size:.9em}
.dsHang .hai2{display:flex;gap:10px}
.dsHang .lc{min-height:64px;min-width:100px;font-size:.9em}
.dsHang.xong{background:linear-gradient(180deg,#f1fff3,#c9f1d0);box-shadow:inset 0 0 0 4px #19a24a,0 5px 0 #0b6a2b}

/* stepper */
.stepper{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;margin:4px}
.stepper button{width:56px;height:64px;border:none;border-radius:16px;font-size:1.3em;font-weight:900;background:linear-gradient(180deg,#fff,#ece1ff);box-shadow:inset 0 0 0 3px #8c55e6,0 4px 0 #5430b0}
.stepper button:active{transform:translateY(3px)}
.stepper .gt{min-width:80px;height:76px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:1.6em;font-weight:900;box-shadow:inset 0 0 0 4px var(--c1)}
.stepper.dung .gt{background:#eafbee;box-shadow:inset 0 0 0 5px #19a24a;color:#0b5a22}
.dongDien{font-weight:800;line-height:2.4;font-size:1.05em}

/* giấy chứng nhận */
.gcn{position:relative;background:#fffdf3;border-radius:22px;padding:26px 30px;text-align:center;
  border:14px solid transparent;background-image:linear-gradient(#fffdf3,#fffdf3),repeating-linear-gradient(45deg,#ff6b6b 0 20px,#ffd43b 20px 40px,#51cf66 40px 60px,#339af0 60px 80px,#cc5de8 80px 100px);
  background-origin:border-box;background-clip:padding-box,border-box;box-shadow:0 10px 0 #c99a00,0 30px 40px #0003}
.gcn .tq{font-weight:800;font-size:.72em;letter-spacing:.06em;color:#7a5b00}
.gcn h2{font-size:clamp(28px,4vw,50px);line-height:1.1;margin:4px 0;color:#c2410c;text-shadow:0 3px 0 #ffe08a}
.gcn h3{font-size:clamp(30px,4.6vw,58px);font-weight:900;background:linear-gradient(90deg,#e8590c,#d6336c,#7048e8);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
.gcn .ten{font-family:"Segoe Script","Brush Script MT",cursive;font-size:clamp(30px,4.4vw,54px);color:#1c4fb8;border-bottom:3px dashed #9fb2e6;display:inline-block;min-width:60%;padding:0 12px}
.gcn .huy{font-size:72px;line-height:1;position:absolute;top:10px}
.gcn .ky{display:flex;justify-content:space-between;margin-top:18px;font-weight:700;font-size:.8em}
.nhapTen{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:800}
.nhapTen input{font-size:1em;padding:10px 14px;border-radius:14px;border:3px solid #9fb2e6;min-height:60px;flex:1;min-width:180px}

@keyframes nhay{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes lac{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@keyframes hien{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes nhip{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.vao{animation:hien .3s ease both} .saiA{animation:lac .34s ease} .nhipA{animation:nhip 1s ease infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:860px){
  .bia1,.hai,.banVe{grid-template-columns:1fr} .luoiChon{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tab{font-size:0;padding:8px 12px} .tab:before{content:attr(data-ic);font-size:22px}
  #btnFull{display:none}
  .chan .nut{min-height:56px;padding:6px 12px;font-size:.72em}
  .mas{order:2;flex:1 1 100%} .bongNoi{font-size:.7em}
  .dsHang{grid-template-columns:1fr}
  .giay{max-height:46vh}
  .nutNho{width:44px;height:44px;font-size:20px;border-radius:13px} #btnTieng{display:none}
  .tren{gap:5px;padding:6px 8px} .tabs{gap:5px} .tab{min-height:44px;padding:6px 9px} .tab:before{font-size:19px}

<script>
/* ============ ÂM THANH + NHẠC NỀN (Web Audio, không cần file) ============ */
const AmThanh=(()=>{
  let ctx=null, tieng=true, nhacBat=true, bus=null, nhieu=null, timer=null, tiep=0, buoc=0, dangDuck=false;
  const BPM=124, S16=60/BPM/4, hz=m=>440*Math.pow(2,(m-69)/12);
  function mo(){ if(!ctx){ ctx=new(window.AudioContext||window.webkitAudioContext)(); khoiNhac(); } if(ctx.state==='suspended')ctx.resume(); return ctx; }
  function khoiNhac(){
    bus=ctx.createGain(); bus.gain.value=.5;
    const nen=ctx.createDynamicsCompressor(); bus.connect(nen); nen.connect(ctx.destination);
    const n=(ctx.sampleRate*.5)|0; nhieu=ctx.createBuffer(1,n,ctx.sampleRate); const d=nhieu.getChannelData(0); for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }
  /* hiệu ứng */
  function not(f,tre,dai,dang='sine',to=.18){ if(!tieng)return; const c=mo(),t=c.currentTime+tre,o=c.createOscillator(),g=c.createGain();
    o.type=dang;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(to,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+dai);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dai+.05); }
  /* nhạc */
  function nN(m,t,d,dang,g){ const o=ctx.createOscillator(),a=ctx.createGain(); o.type=dang; o.frequency.value=hz(m);
    a.gain.setValueAtTime(.0001,t); a.gain.exponentialRampToValueAtTime(g,t+.01); a.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(a); a.connect(bus); o.start(t); o.stop(t+d+.03); }
  function kick(t){ const o=ctx.createOscillator(),a=ctx.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+.12);
    a.gain.setValueAtTime(.6,t); a.gain.exponentialRampToValueAtTime(.001,t+.17); o.connect(a); a.connect(bus); o.start(t); o.stop(t+.2); }
  function xuc(t,d,f,g,loai){ const s=ctx.createBufferSource(); s.buffer=nhieu; const fl=ctx.createBiquadFilter(); fl.type=loai; fl.frequency.value=f;
    const a=ctx.createGain(); a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(.001,t+d); s.connect(fl); fl.connect(a); a.connect(bus); s.start(t); s.stop(t+d+.02); }
  const _=null;
  const MEL=[ // 8 ô nhịp x 16 nốt, nốt MIDI
    [76,_,79,_,84,_,79,_,76,_,79,_,76,_,74,_],
    [74,_,79,_,83,_,79,_,74,_,79,_,74,_,72,_],
    [72,_,76,_,81,_,76,_,72,_,76,_,72,_,71,_],
    [77,_,81,_,84,_,81,_,77,_,81,_,79,_,77,_],
    [84,_,79,76,79,_,84,_,88,_,84,_,79,_,76,_],
    [83,_,79,74,79,_,83,_,86,_,83,_,79,_,74,_],
    [81,_,76,72,76,_,81,_,84,_,81,_,76,_,72,_],
    [81,_,77,_,81,_,84,_,86,_,84,_,81,_,79,_]];
  const GOC=[48,43,45,41], HOP=[[60,64,67],[59,62,67],[60,64,69],[60,65,69]];
  function phat(b,t){
    const o=(b>>4)&7, st=b&15, c=o%4, m=MEL[o][st];
    if(st%4===0) kick(t);
    if(st===4||st===12) xuc(t,.13,1800,.22,'bandpass');
    if(st%2===0) xuc(t,st===14?.1:.035,7000,st===14?.07:.045,'highpass');
    if(st%4===0||st===10) nN(GOC[c]+(st===10?12:0),t,.2,'triangle',.28);
    if(st%4===2) HOP[c].forEach(x=>nN(x,t,.09,'square',.02));
    if(m!==null){ nN(m,t,.2,'triangle',.11); nN(m+12,t,.12,'sine',.03); }
  }
  function lich(){ while(tiep<ctx.currentTime+.18){ phat(buoc%128,tiep); tiep+=S16; buoc++; } }
  function chay(){ if(!ctx||timer||!nhacBat)return; tiep=ctx.currentTime+.06; timer=setInterval(lich,30); }
  function dung(){ if(timer){clearInterval(timer);timer=null;} }
  document.addEventListener('visibilitychange',()=>{ if(!ctx)return; if(document.hidden)dung(); else chay(); });
  return{
    moKhoa(){ mo(); chay(); },
    tieng(v){ tieng=v; if(v)mo(); }, dangTieng:()=>tieng,
    nhac(v){ nhacBat=v; if(v){mo();chay();}else dung(); }, dangNhac:()=>nhacBat,
    duck(v){ if(!bus)return; bus.gain.setTargetAtTime(v?.12:.5,ctx.currentTime,.1); },
    dung(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>not(f,i*.07,.3,'triangle',.2));},
    sai(){not(311.13,0,.16,'sine',.1);not(233.08,.13,.3,'sine',.09);},
    cham(){not(880,0,.05,'square',.05);},
    ghep(){not(659.25,0,.13,'sine',.16);not(987.77,.09,.22,'sine',.14);},
    sao(){[1318.5,1568,2093].forEach((f,i)=>not(f,i*.06,.18,'sine',.1));},
    thang(){[523.25,587.33,659.25,698.46,783.99,880,1046.5].forEach((f,i)=>not(f,i*.09,.5,'triangle',.19));}
  };
})();

function phaoGiay(n=90){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.getElementById('phao'),c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const m=['#ff5252','#ffca28','#66bb6a','#42a5f5','#ab47bc','#ff7043'];
  const h=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:Math.random()*-11-4,r:Math.random()*7+4,a:Math.random()*6,m:m[(Math.random()*m.length)|0]}));
  let k=0;(function ve(){c.clearRect(0,0,cv.width,cv.height);h.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.32;p.a+=.15;c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.m;c.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);c.restore();});
    if(++k<150)requestAnimationFrame(ve);else c.clearRect(0,0,cv.width,cv.height);})();
}
function saoBay(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!el||!el.animate)return;
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<9;i++){
    const s=document.createElement('span'); s.className='sBay'; s.textContent=i%3?'⭐':'✨'; s.style.left=cx+'px'; s.style.top=cy+'px'; document.body.appendChild(s);
    const dx=(Math.random()-.5)*260, dy=-60-Math.random()*160;
    s.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1.3)`,opacity:0}],{duration:900,easing:'ease-out'}).onfinish=()=>s.remove();
  }
}

/* ================== VẼ COM PA (dùng chung) ==================
   C: mũi nhọn, r: độ mở (đơn vị svg), goc: radian (hướng đầu chì), U: số đơn vị cho 1 cm */
function veCompa(g,cx,cy,r,goc,U){
  g.innerHTML='';
  const px=cx+r*Math.cos(goc), py=cy+r*Math.sin(goc);
  const nx=Math.sin(goc), ny=-Math.cos(goc);
  const cao=Math.max(1.4*U,Math.min(3.2*U,r*.62+U*.6));
  const hx=(cx+px)/2+nx*cao, hy=(cy+py)/2+ny*cao;
  const w=U*.2;
  const tip=(x1,y1,x2,y2,k)=>[x2+(x1-x2)*k,y2+(y1-y2)*k];
  const [ax,ay]=tip(hx,hy,cx,cy,.16), [bx,by]=tip(hx,hy,px,py,.2), [bx2,by2]=tip(hx,hy,px,py,.07);
  sv('line',{x1:hx,y1:hy,x2:ax,y2:ay,stroke:'#1565c0','stroke-width':w,'stroke-linecap':'round'},g);
  sv('line',{x1:ax,y1:ay,x2:cx,y2:cy,stroke:'#78838f','stroke-width':w*.45,'stroke-linecap':'round'},g);
  sv('line',{x1:hx,y1:hy,x2:bx,y2:by,stroke:'#1e88e5','stroke-width':w,'stroke-linecap':'round'},g);
  sv('line',{x1:bx,y1:by,x2:bx2,y2:by2,stroke:'#ffb000','stroke-width':w*.85,'stroke-linecap':'round'},g);
  sv('line',{x1:bx2,y1:by2,x2:px,y2:py,stroke:'#424242','stroke-width':w*.4,'stroke-linecap':'round'},g);
  sv('line',{x1:hx,y1:hy,x2:hx+nx*U*.55,y2:hy+ny*U*.55,stroke:'#0d47a1','stroke-width':w*.8,'stroke-linecap':'round'},g);
  sv('circle',{cx:hx,cy:hy,r:U*.2,fill:'#42a5f5',stroke:'#fff','stroke-width':U*.06},g);
  return {hx,hy,px,py};
}
/* thước kẻ: gốc (x0,y0) là vạch 0 ở mép trên; dai: số cm */
function veThuoc(g,x0,y0,U,dai,noi){
  const L=dai*U;
  sv('rect',{x:x0-U*.45,y:y0,width:L+U*.9,height:U*1.15,rx:U*.12,fill:noi||'#ffe9a8',stroke:'#c99a00','stroke-width':U*.04},g);
  for(let mm=0;mm<=dai*10;mm++){

  const ruler0={x:150,y:300};
  const CANH=[
   {cap:'Đây là com pa. Một chân có mũi nhọn, một chân gắn đầu chì.',dai:7000,ve(p){

   {cap:'Mọi điểm trên đường tròn đều cách tâm O một khoảng bằng nhau: 2 cm.',dai:8000,ve(p){

     const G=[[-36,'A','#1c8de0'],[60,'B','#1fa149'],[160,'C','#8c55e6'],[235,'D','#e64c9a']];
     G.forEach(([d,t,c],i)=>{ if(p<i*.18)return; const a=d*Math.PI/180, x=O.x+2*U*Math.cos(a), y=O.y+2*U*Math.sin(a);

     if(p>.75) chu(O.x,60,'OA = OB = OC = OD = 2 cm','#c2410c',36); }},
   {cap:'Mẹo nhỏ: cầm com pa ở khớp trên cùng, không bóp hai chân, quay nhẹ theo một chiều.',dai:7000,ve(p){
     diem(O.x,O.y,'O'); const a=kep(p,.2,1)*Math.PI*1.2; cung.setAttribute('d',cungPath(O.x,O.y,2*U,0,a)); const k=veCompa(gCompa,O.x,O.y,2*U,a,U);
     const ta=sv('text',{x:k.hx-26,y:k.hy-30,'font-size':48},gTay); ta.textContent='🤏';
     chu(450,44,'✋ Giữ khớp • 📏 Không đổi độ mở • 🔄 Quay một chiều','#7b3fc4',26); }}
  ];
  const cc=$('cc'); cc.innerHTML=CANH.map((_,i)=>`<button data-i="${i}" title="Cảnh ${i+1}"></button>`).join('');
  let ketThuc=false,ci=0,t0=0,dangPhat=false,cham=false,noi=true,raf=0,daNoi=-1,giuKhung=false,tDung=0;
  function veKhung(p){ gThuoc.style.opacity=0; gNhan.innerHTML='';gDiem.innerHTML='';gTay.innerHTML='';gChu.innerHTML=''; if(ci<4)cung.setAttribute('d',''); CANH[ci].ve(Math.max(0,Math.min(1,p)));
    $('pd').textContent=CANH[ci].cap; [...cc.children].forEach((b,i)=>b.className=i===ci?'on':i<ci?'xong':''); }
  function dai(){ return CANH[ci].dai*(cham?1.7:1); }
  function vong(ts){ if(!dangPhat)return; const p=(ts-t0)/dai(); veKhung(p);
    if(p>=1){ if(noi&&Doc.dang){ raf=requestAnimationFrame(vong); return; }
      if(ci<CANH.length-1){ batDau(ci+1); return; } dangPhat=false; ketThuc=true; $('vPhat').textContent='🔁 Xem lại'; mas('dung','Em đã xem hết rồi! Bấm “Tiếp” để tự vẽ nhé!'); return; }
    raf=requestAnimationFrame(vong); }
  function batDau(i){ ci=i; t0=performance.now(); ketThuc=false; if(noi&&dangPhat){ Doc.noi(CANH[ci].cap); } veKhung(0); if(dangPhat){cancelAnimationFrame(raf);raf=requestAnimationFrame(vong);} }
  function phat(){ AmThanh.cham(); if(dangPhat){ dangPhat=false; tDung=performance.now()-t0; cancelAnimationFrame(raf); Doc.dung(); $('vPhat').textContent='▶ Phát'; return; }
    dangPhat=true; $('vPhat').textContent='⏸ Dừng';
    if(ketThuc){ ketThuc=false; tDung=0; batDau(0); return; }
    t0=performance.now()-tDung; if(noi&&tDung<300)Doc.noi(CANH[ci].cap); raf=requestAnimationFrame(vong); }
  $('vPhat').onclick=phat;
  $('vTruoc').onclick=()=>{AmThanh.cham(); tDung=0; batDau(Math.max(0,ci-1));};
  $('vSau').onclick=()=>{AmThanh.cham(); tDung=0; batDau(Math.min(CANH.length-1,ci+1));};
  $('vCham').onclick=()=>{cham=!cham; $('vCham').textContent=cham?'🐇 Bình thường':'🐢 Chậm'; bao(cham?'Đã chuyển sang tốc độ chậm':'Tốc độ bình thường');};
  $('vNoi').onclick=()=>{noi=!noi; $('vNoi').textContent='🗣️ Thuyết minh: '+(noi?'bật':'tắt'); if(!noi)Doc.dung();};
  cc.onclick=e=>{ const b=e.target.closest('button'); if(!b)return; tDung=0; batDau(+b.dataset.i); };
  veKhung(0);
  return ()=>{ dangPhat=false; cancelAnimationFrame(raf); Doc.dung(); };
}

them(1,{ten:'Xem và học',doc:'Em xem hoạt hình hướng dẫn vẽ đường tròn bằng com pa. Bấm Phát để bắt đầu.',ve(t){

/* ================== BÀN VẼ COM PA ================== */
const CM=40;
function banVe(N,cfg){
  // cfg: w,h (cm); diem:{ten:[x,y]} (cm); viec:[...]; onXong
  htm(N,`<div class="banVe"><svg class="giay" id="gy" viewBox="0 0 ${cfg.w*CM} ${cfg.h*CM}"></svg>
   <div class="bang">
     <div class="dsViec" id="dsv"></div>
     <div class="buoc3" id="b3"><span>① Mở com pa</span><span>② Đặt mũi nhọn</span><span>③ Quay com pa</span></div>
     <div class="thuocBox" id="tb"><div class="doMo">Độ mở com pa: <b id="dm"></b></div><svg id="tsvg" viewBox="0 ${-1.6*CM} ${11*CM} ${4.2*CM}"></svg>
       <div class="hangNut" style="gap:8px"><button class="nutCong" data-d="-10">−1 cm</button><button class="nutCong" data-d="-1">−1 mm</button><button class="nutCong" data-d="1">+1 mm</button><button class="nutCong" data-d="10">+1 cm</button></div></div>
     <div class="hangNut" style="gap:10px"><button class="nut xanh nho" id="bQuay">🔄 Quay com pa</button><button class="nut vang nho" id="bMau">🪄 Làm mẫu bước này</button></div>
     <p class="ph" id="ph"></p>
   </div></div>`);
  const gy=$('gy'), W=cfg.w*CM, H=cfg.h*CM;
  const defs=sv('defs',{},gy); const pt=sv('pattern',{id:'o5',width:CM/2,height:CM/2,patternUnits:'userSpaceOnUse'},defs);
  sv('path',{d:`M ${CM/2} 0 L 0 0 0 ${CM/2}`,fill:'none',stroke:'#edf2fc','stroke-width':1},pt);
  const pt2=sv('pattern',{id:'o10',width:CM,height:CM,patternUnits:'userSpaceOnUse'},defs);
  sv('rect',{width:CM,height:CM,fill:'url(#o5)'},pt2); sv('path',{d:`M ${CM} 0 L 0 0 0 ${CM}`,fill:'none',stroke:'#d5e1f7','stroke-width':1.6},pt2);
  sv('rect',{width:W,height:H,fill:'url(#o10)'},gy);
  const tl=sv('g',{},gy); sv('line',{x1:CM*.6,y1:H-CM*.6,x2:CM*1.6,y2:H-CM*.6,stroke:'#8fa3d6','stroke-width':4},tl);
  const tlt=sv('text',{x:CM*1.8,y:H-CM*.45,'font-size':CM*.42,'font-weight':700,fill:'#8fa3d6'},tl); tlt.textContent='1 ô to = 1 cm';
  const gV=sv('g',{},gy), gTam=sv('g',{},gy), gD=sv('g',{},gy), gC=sv('g',{},gy);
  const cungT=sv('path',{fill:'none','stroke-width':5,'stroke-linecap':'round'},gTam);
  const D={}; const VONG=[]; // vòng đã vẽ {tam,r,mau}
  function datDiem(ten,x,y,mau){ D[ten]={x,y}; const g=sv('g',{},gD); sv('circle',{cx:x,cy:y,r:CM*.16,fill:mau||'#1b2559'},g);
    const t=sv('text',{x:x+CM*.22,y:y-CM*.22,'font-size':CM*.62,'font-weight':900,fill:mau||'#1b2559',stroke:'#fff','stroke-width':5,'paint-order':'stroke'},g); t.textContent=ten; D[ten].g=g; }
  for(const k in (cfg.diem||{})) datDiem(k,cfg.diem[k][0]*CM,cfg.diem[k][1]*CM);
  // thước
  const ts=$('tsvg'); const tsG=sv('g',{},ts); veThuoc(tsG,CM*.6,CM*1.3,CM,10); const tsC=sv('g',{},ts);
  let mo=20, viec=0, pha=0, tam=null, goc=0, quet=0, dangQuay=false, khoa=false;
  const V=cfg.viec;
  function capThuoc(){ $('dm').textContent=nhanCm(mo)+(mo%10?` (${mo} mm)`:''); veCompa(tsC,CM*.6,CM*1.3,mo*CM/10,0,CM*.7); }
  function moiViec(){ const v=V[viec]; return v; }
  function veDs(){ $('dsv').innerHTML=V.map((v,i)=>`<div class="viec ${i<viec?'xong':i===viec?'dang':''}"><span class="sv">${i<viec?'✓':i+1}</span><span>${v.loi}</span></div>`).join('');
    const c=$('dsv').children[viec]; if(c)c.scrollIntoView({block:'nearest'});
    const v=V[viec]; const laVong=v&&v.k==='tron';
    $('tb').style.opacity=laVong?1:.45; $('bQuay').disabled=!laVong||!tam;
    [...$('b3').children].forEach((s,i)=>{ s.className=!laVong?'':i<pha?'ok':i===pha?'on':''; }); }
  function capPha(){ const v=V[viec]; if(!v||v.k!=='tron')return; pha=tam?2:(mo===v.r?1:0); if(pha===1&&!tam) pha=1; veDs(); }
  function phHien(c,t){ $('ph').className='ph '+(c||''); $('ph').textContent=t; }
  function toaDo(e){ const p=gy.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(gy.getScreenCTM().inverse()); return {x:q.x,y:q.y}; }
  function veCompaBan(){ if(tam) veCompa(gC,tam.x,tam.y,mo*CM/10,goc,CM); else gC.innerHTML=''; }
  function veCung(mau){ const r=mo*CM/10; const a=Math.min(Math.abs(quet),Math.PI*2); cungT.setAttribute('stroke',mau||'#888');
    if(a<=0){cungT.setAttribute('d','');return;}
    const s=goc-(quet>0?a:-a)*0; const a0=quet>0?goc-a:goc, a1=quet>0?goc:goc+a;
    if(a>=Math.PI*2-1e-3){ cungT.setAttribute('d',`M ${tam.x+r} ${tam.y} A ${r} ${r} 0 1 1 ${tam.x-r} ${tam.y} A ${r} ${r} 0 1 1 ${tam.x+r} ${tam.y}`); return; }
    const x0=tam.x+r*Math.cos(a0),y0=tam.y+r*Math.sin(a0),x1=tam.x+r*Math.cos(a1),y1=tam.y+r*Math.sin(a1);
    cungT.setAttribute('d',`M ${x0} ${y0} A ${r} ${r} 0 ${a>Math.PI?1:0} 1 ${x1} ${y1}`); }
  function datMo(m){ if(dangQuay||khoa)return; mo=Math.max(5,Math.min(100,Math.round(m))); capThuoc(); quet=0; veCung(); veCompaBan(); const v=V[viec];
    if(v&&v.k==='tron'){ pha=tam?2:(mo===v.r?1:0); veDs(); if(!tam&&mo===v.r)phHien('tot','✓ Độ mở đúng rồi! Bây giờ em chạm vào điểm '+v.tam+' để đặt mũi nhọn.'); } }
  // kéo trên thước
  let keoT=false;
  const thuocMm=e=>{ const p=ts.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(ts.getScreenCTM().inverse()); return (q.x-CM*.6)/CM*10; };
  ts.addEventListener('pointerdown',e=>{ keoT=true; ts.setPointerCapture(e.pointerId); datMo(thuocMm(e)); AmThanh.cham(); });
  ts.addEventListener('pointermove',e=>{ if(keoT)datMo(thuocMm(e)); });
  ts.addEventListener('pointerup',()=>{keoT=false;});
  N.querySelectorAll('.nutCong').forEach(b=>b.onclick=()=>{ AmThanh.cham(); datMo(mo+ +b.dataset.d); });
  // xử lý giấy
  let keoG=false, gocTruoc=0;
  gy.addEventListener('pointerdown',e=>{ if(khoa)return; const v=V[viec]; if(!v)return; const p=toaDo(e);
    if(v.k==='cham'){ datDiem(v.ten,p.x,p.y,v.mau); AmThanh.ghep(); xongViec('✓ Em đã chấm điểm '+v.ten+'.'); return; }
    if(v.k==='tren'){ const c=D[v.tam], r=v.r*CM/10, d=Math.hypot(p.x-c.x,p.y-c.y);
      if(Math.abs(d-r)<CM*.9){ const a=Math.atan2(p.y-c.y,p.x-c.x); datDiem(v.ten,c.x+r*Math.cos(a),c.y+r*Math.sin(a),v.mau); AmThanh.ghep(); xongViec(`✓ Điểm ${v.ten} nằm trên đường tròn rồi!`); }
      else { saiRoi(null,'Em chạm đúng vào nét của đường tròn nhé!'); phHien('chua',`🤔 Em chạm đúng vào nét đường tròn tâm ${v.tam} bán kính ${nhanCm(v.r)} nhé.`); nhayVong(v.tam,v.r); }
      return; }
    if(v.k==='tron'){
      if(!tam){ const c=D[v.tam]; if(Math.hypot(p.x-c.x,p.y-c.y)<CM*1.1){ tam={x:c.x,y:c.y}; goc=0; quet=0; AmThanh.ghep(); veCompaBan(); pha=2; veDs();
          phHien(mo===v.r?'tot':'', mo===v.r?'✓ Đặt mũi nhọn đúng rồi! Kéo vòng quanh hoặc bấm 🔄 để quay com pa.':'Mũi nhọn đã ở '+v.tam+'. Em kiểm tra độ mở rồi quay com pa nhé.'); }
        else { saiRoi(null,'Mũi nhọn phải đặt đúng vào điểm '+v.tam+' nhé!'); phHien('chua','🤔 Em chạm vào đúng điểm '+v.tam+' để đặt mũi nhọn.'); nhayDiem(v.tam); }
        return; }
      keoG=true; gy.setPointerCapture(e.pointerId); gocTruoc=Math.atan2(p.y-tam.y,p.x-tam.x); }
  });
  gy.addEventListener('pointermove',e=>{ if(!keoG||dangQuay)return; const p=toaDo(e); const a=Math.atan2(p.y-tam.y,p.x-tam.x); let d=a-gocTruoc;
    if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; gocTruoc=a; goc+=d; quet+=d; veCompaBan(); veCung(V[viec].mau); if(Math.abs(quet)>=Math.PI*2-.05){ keoG=false; hoanVong(); } });
  gy.addEventListener('pointerup',()=>{ if(keoG&&Math.abs(quet)>.2&&Math.abs(quet)<Math.PI*2-.05) bao('Em quay tiếp cho đủ một vòng nhé 🔄'); keoG=false; });
  function quayTuDong(){ if(!tam||dangQuay)return; dangQuay=true; const g0=goc, q0=quet, t0=performance.now(), D2=1700*(1-Math.abs(q0)/(Math.PI*2));
    (function b(ts){ const p=Math.min(1,(ts-t0)/D2); quet=q0+(Math.PI*2-Math.abs(q0))*p*(q0<0?-1:1); goc=g0+(quet-q0); veCompaBan(); veCung(V[viec].mau);
      if(p<1)requestAnimationFrame(b); else { dangQuay=false; hoanVong(); } })(performance.now()); }
  $('bQuay').onclick=()=>{ AmThanh.cham(); quayTuDong(); };
  function hoanVong(){ const v=V[viec]; quet=Math.PI*2; veCung(v.mau);
    if(mo===v.r){ const r=mo*CM/10; const c=sv('circle',{cx:tam.x,cy:tam.y,r,fill:'none',stroke:v.mau,'stroke-width':5},gV); c.dataset.k=v.tam+'_'+v.r;
      VONG.push({tam:v.tam,r:v.r,el:c}); cungT.setAttribute('d',''); tam=null; gC.innerHTML='';
      xongViec(`✓ Em vẽ đúng đường tròn tâm ${v.tam} bán kính ${nhanCm(v.r)}!`, true); }
    else { khoa=true; cungT.setAttribute('d',''); AmThanh.sai(); const r=mo*CM/10; const sai=sv('circle',{cx:tam.x,cy:tam.y,r,fill:'none',stroke:'#b0b8c9','stroke-width':4,'stroke-dasharray':'10 8'},gV);
      const msg=`🤔 Em đã mở com pa ${nhanCm(mo)}, đề bài cần ${nhanCm(v.r)}. Em chỉnh lại độ mở trên thước rồi quay lại nhé!`; phHien('chua',msg); mas('sai','Gần đúng rồi! Em xem lại độ mở com pa nha 💛');
      setTimeout(()=>{ sai.remove(); cungT.setAttribute('d',''); quet=0; khoa=false; pha=0; veDs(); },1600); } }
  function nhayDiem(ten){ const g=D[ten]&&D[ten].g; if(!g)return; const c=g.querySelector('circle'); c.classList.add('nhipA'); setTimeout(()=>c.classList.remove('nhipA'),2400); }
  function nhayVong(tamT,r){ const c=gV.querySelector(`[data-k="${tamT}_${r}"]`); if(!c)return; c.setAttribute('stroke-width',10); setTimeout(()=>c.setAttribute('stroke-width',5),1500); }
  function xongViec(t,lon){ viec++; pha=0; tam=null; gC.innerHTML='';
    if(viec>=V.length){ veDs(); phHien('tot',t); const k=dungRoi(gy, ''); phHien('tot',t+' '+k); cfg.onXong&&cfg.onXong(); return; }
    if(lon){ AmThanh.dung(); mas('dung',t); saoBay(gy); } veDs(); phHien('tot',t+' Tiếp theo: '+V[viec].loi); }
  // làm mẫu
  $('bMau').onclick=()=>{ if(dangQuay||khoa)return; const v=V[viec]; if(!v)return; AmThanh.cham();
    if(v.k==='cham'){ const [x,y]=v.goiY; datDiem(v.ten,x*CM,y*CM,v.mau); xongViec('Bé Com Pa đã chấm điểm '+v.ten+' giúp em.'); return; }
    if(v.k==='tren'){ const c=D[v.tam], r=v.r*CM/10, a=(v.gocGoiY||180)*Math.PI/180; datDiem(v.ten,c.x+r*Math.cos(a),c.y+r*Math.sin(a),v.mau); xongViec('Bé Com Pa đã lấy điểm '+v.ten+' giúp em.'); return; }
    if(mo!==v.r){ const dich=v.r, b0=mo, t0=performance.now(); (function b(ts){ const p=Math.min(1,(ts-t0)/700); mo=Math.round(b0+(dich-b0)*p); capThuoc(); if(p<1)requestAnimationFrame(b); else { pha=1; veDs(); phHien('','📏 Đã mở com pa '+nhanCm(dich)+'. Bấm “Làm mẫu” lần nữa để đặt mũi nhọn.'); } })(performance.now()); return; }
    if(!tam){ const c=D[v.tam]; tam={x:c.x,y:c.y}; goc=0; quet=0; veCompaBan(); pha=2; veDs(); phHien('','📍 Đã đặt mũi nhọn vào '+v.tam+'. Bấm 🔄 để quay com pa.'); return; }
    quayTuDong(); };
  capThuoc(); veDs(); phHien('',V[0].loi);
  return {xongHet:()=>{ while(viec<V.length){ const v=V[viec];
      if(v.k==='cham'){ datDiem(v.ten,v.goiY[0]*CM,v.goiY[1]*CM,v.mau); }
      else if(v.k==='tren'){ const c=D[v.tam], r=v.r*CM/10, a=(v.gocGoiY||180)*Math.PI/180; datDiem(v.ten,c.x+r*Math.cos(a),c.y+r*Math.sin(a),v.mau); }
      else { const c=D[v.tam]; sv('circle',{cx:c.x,cy:c.y,r:v.r*CM/10,fill:'none',stroke:v.mau,'stroke-width':5},gV); }
      viec++; } tam=null; gC.innerHTML=''; cungT.setAttribute('d',''); veDs(); phHien('tot','Đây là hình vẽ đúng. Em xem kĩ rồi tự vẽ lại nhé!'); cfg.onXong&&cfg.onXong(true); }};
}

them(1,{ten:'Em tập vẽ',sao:1,doc:'Em hãy dùng com pa để vẽ đường tròn tâm O bán kính 2 xăng-ti-mét. Bước 1, mở com pa 2 xăng-ti-mét trên thước. Bước 2, đặt mũi nhọn vào điểm O. Bước 3, quay com pa một vòng.',ve(t){

them(2,{ten:'Bài 2a',sao:1,doc:'Bài 2 a. Quan sát rồi vẽ hình theo hướng dẫn. Bước 1: vẽ đường tròn tâm S bán kính 25 mi-li-mét và đường tròn tâm S bán kính 7 xăng-ti-mét. Bước 2: lấy điểm E trên đường tròn tâm S bán kính 7 xăng-ti-mét, vẽ đường tròn tâm E bán kính 15 mi-li-mét và đường tròn tâm E bán kính 3 xăng-ti-mét. Bước 3: lấy điểm M trên đường tròn tâm E bán kính 3 xăng-ti-mét, vẽ đường tròn tâm M bán kính 12 mi-li-mét.',ve(t){

them(2,{ten:'Bài 2b',sao:1,doc:'Bài 2 b. Em hãy tô màu và trang trí các hình tròn để được mô hình Trái Đất, Mặt Trời và Mặt Trăng. Chọn màu, rồi chạm vào hình tròn để tô.',ve(t){
  const N=theMoi(t,'Bài 2b) Tô màu, trang trí mô hình Trái Đất, Mặt Trời, Mặt Trăng 🎨');
  const MAU=[['#e8453c','Đỏ'],['#ff9f1a','Cam'],['#ffd23f','Vàng'],['#1fa149','Xanh lá'],['#1c8de0','Xanh dương'],['#8c55e6','Tím'],['#e64c9a','Hồng'],['#ffffff','Tẩy']];
  htm(N,`<div class="hai"><svg class="hinhSvg" viewBox="0 0 640 520" id="h"></svg>
    <div class="bang"><p class="huongDan">① Chọn màu &nbsp; ② Chạm vào hình tròn để tô</p>
     <div class="bangMau">${MAU.map((m,i)=>`<button class="oMau ${i===0?'on':''}" data-i="${i}" style="background:${m[0]}" title="${m[1]}">${i===7?'<span>🧽</span>':''}</button>`).join('')}</div>
     <p class="huongDan">✨ Trang trí thêm:</p>
     <div class="hangNut" style="gap:10px"><button class="nut cam nho" id="tN">☀️ Tia nắng</button><button class="nut nho" id="tL">🌍 Lục địa</button><button class="nut tim nho" id="tS">✨ Ngôi sao</button><button class="nut vang nho" id="tM">🪄 Tô theo mẫu</button></div>
     <p class="ph" id="ph"></p></div></div>`);
  const h=$('h'); sv('rect',{width:640,height:520,rx:22,fill:'#fff'},h); const gSao=sv('g',{},h);
  const S0={x:400,y:270}, E={x:400-210,y:270}, M={x:E.x-90*Math.cos(Math.PI/4),y:E.y-90*Math.sin(Math.PI/4)};
  sv('circle',{cx:S0.x,cy:S0.y,r:210,fill:'none',stroke:'#e8453c','stroke-width':3},h);
  sv('circle',{cx:E.x,cy:E.y,r:90,fill:'none',stroke:'#1c8de0','stroke-width':3},h);
  const gNang=sv('g',{},h);
  const VAT=[{ten:'Mặt Trời',c:S0,r:75,muc:'#e8453c'},{ten:'Trái Đất',c:E,r:45,muc:'#1c8de0'},{ten:'Mặt Trăng',c:M,r:36,muc:'#ffd23f'}];
  const gLuc=sv('g',{'pointer-events':'none'},h);
  let chon=0; const daTo=new Set();
  VAT.forEach((v,i)=>{ v.el=sv('circle',{cx:v.c.x,cy:v.c.y,r:v.r,fill:'#fff',stroke:'#1b2559','stroke-width':4,class:'diemCham'},h);
    const tt=sv('text',{x:v.c.x,y:v.c.y+v.r+30,'text-anchor':'middle','font-size':22,'font-weight':900,fill:'#1b2559',stroke:'#fff','stroke-width':5,'paint-order':'stroke'},h); tt.textContent=v.ten;
    v.el.addEventListener('click',()=>{ const m=MAU[chon][0]; v.el.setAttribute('fill',m); AmThanh.ghep(); if(chon===7)daTo.delete(i); else daTo.add(i); kiem(); }); });
  // giữ nhãn trên cùng của lục địa
  h.appendChild(gLuc);
  function kiem(){ if(daTo.size===3&&!t.xong){ t.xong=1; $('ph').className='ph tot'; $('ph').textContent='✓ '+dungRoi(h)+' Mô hình của em đẹp quá! Em trang trí thêm cho lung linh nhé!'; nhanSao(); } }
  N.querySelectorAll('.oMau').forEach(b=>b.onclick=()=>{ chon=+b.dataset.i; AmThanh.cham(); N.querySelectorAll('.oMau').forEach(x=>x.classList.toggle('on',x===b)); });
  $('tN').onclick=()=>{ AmThanh.sao(); gNang.innerHTML=''; for(let k=0;k<12;k++){ const a=k*Math.PI/6; sv('line',{x1:S0.x+88*Math.cos(a),y1:S0.y+88*Math.sin(a),x2:S0.x+118*Math.cos(a),y2:S0.y+118*Math.sin(a),stroke:'#ff9f1a','stroke-width':8,'stroke-linecap':'round'},gNang);} };
  $('tL').onclick=()=>{ AmThanh.sao(); gLuc.innerHTML=''; [[-14,-12,16,11],[12,10,14,9],[16,-18,8,6],[-16,18,9,7]].forEach(([dx,dy,rx,ry])=>sv('ellipse',{cx:E.x+dx,cy:E.y+dy,rx,ry,fill:'#1fa149',opacity:.92},gLuc)); };
  $('tS').onclick=()=>{ AmThanh.sao(); gSao.innerHTML=''; for(let k=0;k<26;k++){ const tt=sv('text',{x:20+Math.random()*600,y:30+Math.random()*470,'font-size':14+Math.random()*16,opacity:.8},gSao); tt.textContent=k%3?'✦':'⭐'; } };
  $('tM').onclick=()=>{ VAT.forEach((v,i)=>{ v.el.setAttribute('fill',v.muc); daTo.add(i); }); $('tL').onclick(); AmThanh.ghep(); kiem(); };
  t.dapAn=()=>$('tM').onclick();
}});
</script>

<script>
/* ================== 4. VẬN DỤNG: 5 bài (đã thay số) ================== */
them(3,{ten:'Bài 1/5',sao:1,doc:'Bài 1. Vẽ đường tròn tâm A bán kính 4 xăng-ti-mét.',ve(t){
  const N=theMoi(t,'Bài 1) Vẽ đường tròn tâm A bán kính 4 cm. ✏️');
  const b=banVe(N,{w:16,h:11,viec:[{k:'cham',ten:'A',goiY:[8,5.5],mau:'#1b2559',loi:'Chạm vào giấy để chấm điểm A (ở giữa giấy).'},{k:'tron',tam:'A',r:40,mau:'#8c55e6',loi:'Vẽ đường tròn tâm A bán kính 4 cm.'}],onXong(x){ if(!x)nhanSao(); else S.trang[idx]=1; }});
  t.dapAn=b.xongHet;
}});

them(3,{ten:'Bài 2/5',sao:1,doc:'Bài 2. Com pa được mở như hình. Em sẽ vẽ được đường tròn có bán kính bao nhiêu?',ve(t){
  const N=theMoi(t,'Bài 2) Com pa mở như hình. Em vẽ được đường tròn bán kính bao nhiêu? 📏');
  htm(N,`<svg class="hinhSvg" viewBox="0 -100 680 380" id="h"></svg>
   <div class="luoiChon" style="grid-template-columns:repeat(2,minmax(0,1fr))">${['5 cm','5 cm 5 mm','6 cm','4 cm 5 mm'].map((x,i)=>`<button class="lc m${[0,3,2,4][i]}" data-i="${i}"><span class="so">${'ABCD'[i]}</span><span style="flex:1">${x}</span></button>`).join('')}</div><p class="ph" id="ph"></p>`);
  const h=$('h'), U=80; veThuoc(sv('g',{},h),60,170,U,7.4); veCompa(sv('g',{},h),60,170,5.5*U,0,U);
  const B=[...N.querySelectorAll('.lc')];
  B.forEach(b=>b.onclick=()=>{ if(b.disabled)return; const i=+b.dataset.i;
    if(i===1){ B.forEach(x=>x.disabled=true); b.classList.add('laDung'); b.insertAdjacentHTML('beforeend','<span class="dau2">✓</span>'); $('ph').className='ph tot'; $('ph').textContent='✓ '+dungRoi(b)+' Đầu chì ở giữa vạch 5 và 6: 5 cm 5 mm = 55 mm.'; nhanSao(); }
    else { b.classList.add('laSai'); b.disabled=true; b.insertAdjacentHTML('beforeend','<span class="dau2">✗</span>'); saiRoi(b); $('ph').className='ph chua'; $('ph').textContent='🤔 Em đếm kĩ: đầu chì qua vạch 5 thêm mấy vạch nhỏ (mm)?'; } });
  t.dapAn=()=>B[1].click();
}});

function stepper(id,max){ return `<span class="stepper" id="${id}"><button data-d="-1" aria-label="bớt">−</button><span class="gt">0</span><button data-d="1" aria-label="thêm">+</button></span>`; }
function ganStepper(el,max,doi){ let v=0; el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(el.classList.contains('dung'))return; AmThanh.cham(); v=(v+ +b.dataset.d+max+1)%(max+1); el.querySelector('.gt').textContent=v; doi&&doi(v); }); return {lay:()=>v,dat:x=>{v=x;el.querySelector('.gt').textContent=x;}}; }

them(3,{ten:'Bài 3/5',sao:1,doc:'Bài 3. Muốn vẽ đường tròn bán kính 45 mi-li-mét, em mở com pa từ vạch 0 đến vạch mấy xăng-ti-mét mấy mi-li-mét? Bấm cộng trừ để chọn số rồi bấm Kiểm tra.',ve(t){
  const N=theMoi(t,'Bài 3) Muốn vẽ đường tròn bán kính 45 mm, em mở com pa thế nào? 🤔');
  htm(N,`<p class="dongDien">Đặt mũi nhọn ở vạch 0, đầu chì ở vạch ${stepper('s1')} cm ${stepper('s2')} mm của thước.</p>
    <div class="hangNut"><button class="nut" id="kt">✔ Kiểm tra</button><button class="nut vang nho" id="gy2">💡 Gợi ý</button></div>
    <div class="goiY" id="gyT" hidden>45 mm = 40 mm + 5 mm. Mà 40 mm = 4 cm. Vậy 45 mm = ? cm ? mm</div><p class="ph" id="ph"></p>
    <svg class="hinhSvg" viewBox="0 -100 800 340" id="h" style="max-width:700px"></svg>`);
  const a=ganStepper($('s1'),9,ve), b=ganStepper($('s2'),9,ve); const h=$('h'), U=70; veThuoc(sv('g',{},h),60,150,U,10); const gc=sv('g',{},h);
  function ve(){ veCompa(gc,60,150,Math.max(.3,(a.lay()*10+b.lay())/10)*U,0,U); } ve();
  $('gy2').onclick=()=>{ $('gyT').hidden=false; AmThanh.cham(); };
  $('kt').onclick=()=>{ if(a.lay()===4&&b.lay()===5){ $('s1').classList.add('dung'); $('s2').classList.add('dung'); $('kt').disabled=true; $('ph').className='ph tot'; $('ph').textContent='✓ '+dungRoi($('kt'))+' 45 mm = 4 cm 5 mm.'; nhanSao(); }
    else { saiRoi($('kt')); $('ph').className='ph chua'; $('ph').textContent='🤔 Em mở '+nhanCm(a.lay()*10+b.lay())+' = '+(a.lay()*10+b.lay())+' mm, chưa bằng 45 mm. Thử lại nhé!'; $('gyT').hidden=false; } };
  t.dapAn=()=>{ a.dat(4); b.dat(5); ve(); $('kt').onclick(); };
}});

them(3,{ten:'Bài 4/5',sao:1,doc:'Bài 4. Đúng ghi Đ, sai ghi S. Em đọc từng câu rồi chọn Đúng hoặc Sai.',ve(t){
  const N=theMoi(t,'Bài 4) Đúng hay sai? Chọn cho từng câu nhé! ✅');
  const C=[['Mọi điểm trên đường tròn tâm O đều cách tâm O một khoảng bằng nhau.',1,'Đúng: mọi bán kính bằng nhau.'],
    ['Muốn vẽ đường tròn bán kính 6 cm, em mở com pa từ vạch 0 đến vạch 6 cm.',1,'Đúng: độ mở com pa chính là bán kính.'],
    ['Khi đang quay com pa, có thể nhấc mũi nhọn ra khỏi tâm O.',0,'Sai: phải giữ chặt mũi nhọn ở tâm O.'],
    ['Đường tròn bán kính 2 cm lớn hơn đường tròn bán kính 25 mm.',0,'Sai: 2 cm = 20 mm, mà 20 mm < 25 mm.']];
  htm(N,C.map((c,i)=>`<div class="dsHang m${[3,2,0,4][i]}" data-i="${i}"><span class="nd">${'abcd'[i]}) ${c[0]}</span><span class="hai2"><button class="lc m2" data-v="1">Đ ✓</button><button class="lc m0" data-v="0">S ✗</button></span></div>`).join('')+'<p class="ph" id="ph"></p>');
  let ok=0;
  N.querySelectorAll('.dsHang').forEach(hg=>{ const i=+hg.dataset.i; hg.querySelectorAll('.lc').forEach(b=>b.onclick=()=>{ if(hg.classList.contains('xong'))return;
    if(+b.dataset.v===C[i][1]){ hg.classList.add('xong'); hg.querySelectorAll('.lc').forEach(x=>x.disabled=true); b.classList.add('laDung'); AmThanh.ghep(); ok++;
      $('ph').className='ph tot'; $('ph').textContent='✓ '+C[i][2];
      if(ok===C.length){ $('ph').textContent='✓ '+dungRoi(N.querySelector('.dsHang'))+' Em làm đúng cả 4 câu!'; nhanSao(); } }
    else { saiRoi(hg); $('ph').className='ph chua'; $('ph').textContent='🤔 Câu '+'abcd'[i]+' em đọc kĩ lại nhé!'; } }); });
  t.dapAn=()=>N.querySelectorAll('.dsHang').forEach((hg,i)=>{ if(!hg.classList.contains('xong'))hg.querySelector(`.lc[data-v="${C[i][1]}"]`).click(); });
}});

them(3,{ten:'Bài 5/5',sao:1,doc:'Bài 5. Vẽ hình theo hướng dẫn. Bước 1: vẽ đường tròn tâm S bán kính 2 xăng-ti-mét và đường tròn tâm S bán kính 6 xăng-ti-mét. Bước 2: lấy điểm E trên đường tròn tâm S bán kính 6 xăng-ti-mét, vẽ đường tròn tâm E bán kính 1 xăng-ti-mét và đường tròn tâm E bán kính 25 mi-li-mét. Cuối cùng trả lời: đoạn S E dài bao nhiêu xăng-ti-mét?',ve(t){
  const N=theMoi(t,'Bài 5) Vẽ hình theo hướng dẫn rồi trả lời câu hỏi 🌞🌍');
  const b=banVe(N,{w:22,h:20,diem:{S:[12.5,10]},viec:[
    {k:'tron',tam:'S',r:20,mau:'#e8453c',loi:'Bước 1: Vẽ đường tròn tâm S bán kính 2 cm.'},
    {k:'tron',tam:'S',r:60,mau:'#e8453c',loi:'Bước 1: Vẽ đường tròn tâm S bán kính 6 cm.'},
    {k:'tren',ten:'E',tam:'S',r:60,gocGoiY:180,mau:'#1c8de0',loi:'Bước 2: Chạm vào đường tròn tâm S bán kính 6 cm để lấy điểm E.'},
    {k:'tron',tam:'E',r:10,mau:'#1c8de0',loi:'Bước 2: Vẽ đường tròn tâm E bán kính 1 cm.'},
    {k:'tron',tam:'E',r:25,mau:'#1c8de0',loi:'Bước 2: Vẽ đường tròn tâm E bán kính 25 mm.'}],
    onXong(x){ $('cuoi').hidden=false; $('cuoi').scrollIntoView({behavior:'smooth',block:'center'}); }});
  htm(N,`<div id="cuoi" hidden class="ghiNho" style="background:linear-gradient(180deg,#f3ebff,#e1d0ff);box-shadow:inset 0 0 0 4px #8c55e6,0 6px 0 #5430b0">
     <p class="dongDien" style="line-height:2">Câu hỏi: Đoạn thẳng <b>SE</b> dài ${stepper('s5')} cm? <button class="nut nho" id="kt5">✔ Kiểm tra</button></p><p class="ph" id="ph5"></p></div>`);
  const a=ganStepper($('s5'),9);
  $('kt5').onclick=()=>{ if(a.lay()===6){ $('s5').classList.add('dung'); $('kt5').disabled=true; $('ph5').className='ph tot'; $('ph5').textContent='✓ '+dungRoi($('kt5'))+' E nằm trên đường tròn tâm S bán kính 6 cm nên SE = 6 cm.'; nhanSao(); }
    else { saiRoi($('kt5')); $('ph5').className='ph chua'; $('ph5').textContent='🤔 Điểm E nằm trên đường tròn tâm S bán kính mấy cm?'; } };
  t.dapAn=()=>{ if($('cuoi').hidden)b.xongHet(); a.dat(6); $('kt5').onclick(); };
}});

them(3,{ten:'Chứng nhận',doc:'Chúc mừng em đã hoàn thành bài học! Em nhập tên để nhận giấy chứng nhận Nhà Toán học nhí nhé!',ve(t){

   <div class="hangNut"><button class="nut cam" id="in">🖨️ In giấy chứng nhận</button><button class="nut xanh" id="lai">🔁 Học lại từ đầu</button></div>`);
  $('ten').oninput=e=>{ $('gTen').textContent=e.target.value.trim()||'………………………'; };
  $('lop').oninput=e=>{ $('gLop').textContent=e.target.value.trim()||'……'; };
  $('in').onclick=()=>window.print();
  $('lai').onclick=()=>{ S.sao.clear(); S.trang={}; $('saoDem').textContent='⭐ 0'; diToi(0); };
  AmThanh.thang(); phaoGiay(140); setTimeout(()=>phaoGiay(100),700); khenTo('🎓 Chúc mừng Nhà Toán học nhí!'); S.trang[idx]=1;

<script>
/* ================== ĐIỀU KHIỂN ================== */
function veBia(){
  idx=-1; document.body.classList.add('bia'); Doc.dung();
  const N=document.createElement('div'); N.className='the vao p1';
  N.innerHTML=`<div class="bia1"><div style="display:flex;flex-direction:column;gap:14px">
     <span class="nhan" style="align-self:flex-start">📐 Toán 5 · Bài 27</span>
     <div class="tenBai">ĐƯỜNG TRÒN</div>
     <div class="phuDe">Vẽ đường tròn có tâm và bán kính cho trước bằng com pa</div>
     <div style="display:flex;gap:12px;align-items:center">${linhVat(90)}<span class="bongNoi">Chào các bạn! Mình là Bé Com Pa. Cùng vẽ những đường tròn thật đẹp nhé! ⭕</span></div>
     <button class="nut cam" id="batDau" style="align-self:flex-start">▶ Bắt đầu học</button></div>
     <div style="display:flex;flex-direction:column;gap:14px"><img class="anhBia" src="${ANH.bang}" alt="Hình trong sách: bạn Robot vẽ đường tròn">
     <div class="luoi4">${PHAN.map((p,i)=>`<button class="oPhan" data-p="${i}"><span class="ic">${p.ic}</span><span>${i+1}. ${p.ten}<small>${['Game 5 câu dẫn vào bài','Hoạt hình vẽ đường tròn','Bài 1, 2 trong sách','5 bài + giấy chứng nhận'][i]}</small></span></button>`).join('')}</div></div></div>`;
  $('man').innerHTML=''; $('man').appendChild(N);
  $('batDau').onclick=()=>{ AmThanh.moKhoa(); diToi(0); };
  N.querySelectorAll('.oPhan').forEach(b=>b.onclick=()=>{ AmThanh.moKhoa(); diToi(TRANG.findIndex(x=>x.p===+b.dataset.p)); });
  capTab();
}
let dungTruoc=null;
function diToi(i){
  if(dungTruoc){ try{dungTruoc();}catch(e){} dungTruoc=null; }
  Doc.dung();
  if(i<0)return veBia(); if(i>=TRANG.length)i=TRANG.length-1;
  idx=i; document.body.classList.remove('bia'); const t=TRANG[i]; t.xong=0; t.dapAn=null; t.dung=null;
  t.ve(t); dungTruoc=t.dung||null; $('man').parentElement.scrollTop=0;
  const loi=['Cùng chơi khởi động nào! 🎮','Xem kĩ để học cách vẽ nhé! 🔭','Cầm com pa lên, mình cùng làm bài! ✏️','Thử thách cuối cùng! Cố lên! 🏆'][t.p];
  mas('',loi); capTab();
  $('btnTruoc').disabled=i===0; $('btnTiep').textContent=i===TRANG.length-1?'🏠 Trang bìa':'Tiếp →';
  $('btnDapAn')&&($('btnDapAn').hidden=!t.dapAn);
}
function capTab(){ document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',idx>=0&&TRANG[idx].p===+b.dataset.p)); }
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ AmThanh.moKhoa(); AmThanh.cham(); diToi(TRANG.findIndex(x=>x.p===+b.dataset.p)); });
$('btnTiep').onclick=()=>{ AmThanh.cham(); if(idx===TRANG.length-1)return veBia(); diToi(idx+1); };
$('btnTruoc').onclick=()=>{ AmThanh.cham(); if(idx>0)diToi(idx-1); };
$('btnNha').onclick=()=>{ AmThanh.cham(); veBia(); };
$('btnDoc').onclick=()=>{ AmThanh.moKhoa(); if(idx>=0)Doc.noi(TRANG[idx].doc||''); };
// nút xem đáp án gắn vào chân
(function(){ const b=document.createElement('button'); b.className='nut vang'; b.id='btnDapAn'; b.textContent='👀 Xem đáp án';
  $('btnDoc').after(b); b.onclick=()=>{ AmThanh.cham(); const t=TRANG[idx]; if(t&&t.dapAn){ t.dapAn(); mas('','Em xem đáp án rồi tự làm lại nhé! 📖'); } else bao('Trang này không có đáp án'); }; })();
function capNut(){ $('btnNhac').classList.toggle('tat',!AmThanh.dangNhac()); $('btnTieng').textContent=AmThanh.dangTieng()?'🔊':'🔇'; $('btnTieng').classList.toggle('tat',!AmThanh.dangTieng()); }
$('btnNhac').onclick=()=>{ AmThanh.nhac(!AmThanh.dangNhac()); capNut(); bao(AmThanh.dangNhac()?'🎵 Nhạc nền: bật':'🎵 Nhạc nền: tắt'); };
$('btnTieng').onclick=()=>{ AmThanh.tieng(!AmThanh.dangTieng()); capNut(); };
$('btnFull').onclick=()=>{ if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='arrowright'||k===' '){ e.preventDefault(); $('btnTiep').click(); }
  else if(k==='arrowleft'){ $('btnTruoc').click(); }
  else if(k==='m'){ $('btnNhac').click(); }
  else if(k==='f'){ $('btnFull').click(); }
  else if(k==='escape'){ veBia(); }
  else if(k==='r'&&idx>=0){ diToi(idx); }
  else if(/^[1-4]$/.test(k)){ const ds=[...document.querySelectorAll('#man .luoiChon .lc, #man .dsTo .lc')]; const b=ds[+k-1]; if(b&&!b.disabled)b.click(); } });
document.addEventListener('pointerdown',()=>AmThanh.moKhoa(),{once:true});
$('masHinh').innerHTML=linhVat(52);
capNut(); veBia();
</script>
</body>
